services:
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data:/opt/spark-data
    networks:
      - spark-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/spark-data
    networks:
      - spark-net

  jupyter:
    build: .
    image: local-pyspark:latest
    container_name: jupyter
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8888:8888"
    volumes:
      - ./notebook:/opt/spark-notebooks
      - ./data:/opt/spark-data
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge