services:
  db:
    container_name: postgres_container_
    image: postgres:14.17
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:                                          # nuevo: para que "src" espere a que Postgres esté LISTO
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  src:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: src_container_
    command: sleep infinity
    environment:
      DATA_DIR: /app/data
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./src:/app
      - ./data:/app/data
      - ./queries:/app/queries
    depends_on:
      db:
        condition: service_healthy