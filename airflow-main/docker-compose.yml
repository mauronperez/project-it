x-airflow-common:
  &airflow-common

  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.7}

  env_file:
    - ${ENV_FILE_PATH:-.env}

  environment:
    &airflow-common-env

    # ---------------------------------------------------------
    # Airflow
    # ---------------------------------------------------------

    AIRFLOW_PROJ_DIR: '/opt/airflow'

    AIRFLOW__CORE__DAGS_FOLDER: '/opt/airflow/dags'

    # Cambiado de SequentialExecutor a CeleryExecutor
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFg=}

    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-}

    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-}

    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'

    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'

    # ---------------------------------------------------------
    # Airflow Metrics -> StatsD -> Prometheus -> Grafana
    # ---------------------------------------------------------

    AIRFLOW__METRICS__STATSD_ON: 'true'

    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter

    AIRFLOW__METRICS__STATSD_PORT: '9125'

    AIRFLOW__METRICS__STATSD_PREFIX: airflow

    # ---------------------------------------------------------
    # SMTP Gmail
    # ---------------------------------------------------------

    AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com

    AIRFLOW__SMTP__SMTP_STARTTLS: 'true'

    AIRFLOW__SMTP__SMTP_SSL: 'false'

    AIRFLOW__SMTP__SMTP_PORT: '587'

    AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:-}

    AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:-}

    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_USER:-}

    # ---------------------------------------------------------
    # Scheduler health check
    # ---------------------------------------------------------

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

    # ---------------------------------------------------------
    # Additional Python requirements
    # ---------------------------------------------------------

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}

  networks:
    - airflow-network

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on

    redis:
      condition: service_healthy

    postgres:
      condition: service_healthy


services:

  # ===========================================================
  # AIRFLOW METADATA DATABASE
  # ===========================================================

  postgres:
    image: postgres:16

    networks:
      - airflow-network

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  # ===========================================================
  # REDIS
  # ===========================================================

  redis:
    image: redis:7.2-bookworm

    networks:
      - airflow-network

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    restart: always


  # ===========================================================
  # STATSD EXPORTER
  # ===========================================================

  statsd-exporter:
    image: prom/statsd-exporter:latest

    container_name: statsd-exporter

    command:
      - "--statsd.listen-udp=:9125"
      - "--web.listen-address=:9102"

    ports:
      - "9102:9102"

    networks:
      - airflow-network

    restart: always


  # ===========================================================
  # PROMETHEUS
  # ===========================================================

  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    ports:
      - "9090:9090"

    networks:
      - airflow-network

    depends_on:
      - statsd-exporter

    restart: always


  # ===========================================================
  # GRAFANA
  # ===========================================================

  grafana:
    image: grafana/grafana:latest

    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - airflow-network

    depends_on:
      - prometheus

    restart: always


  # ===========================================================
  # AIRFLOW API SERVER
  # ===========================================================

  airflow-apiserver:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/version"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ===========================================================
  # AIRFLOW SCHEDULER
  # ===========================================================

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8974/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ===========================================================
  # AIRFLOW DAG PROCESSOR
  # ===========================================================

  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ===========================================================
  # AIRFLOW CELERY WORKER
  # ===========================================================

  airflow-worker:
    <<: *airflow-common

    command: celery worker

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\" || celery --app airflow.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      <<: *airflow-common-env

      DUMB_INIT_SETSID: "0"

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-apiserver:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully


  # ===========================================================
  # AIRFLOW TRIGGERER
  # ===========================================================

  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ===========================================================
  # AIRFLOW INIT
  # ===========================================================

  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set AIRFLOW_UID environment variable."
          echo
          export AIRFLOW_UID=$$(id -u)
        fi

        one_meg=1048576

        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))

        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)

        disk_available=$$(df / | tail -1 | awk '{print $$4}')

        warning_resources="false"

        if (( mem_available < 4000 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required."
          echo
          warning_resources="true"
        fi

        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo
          warning_resources="true"
        fi

        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo
          warning_resources="true"
        fi

        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You may not have enough resources to run Airflow.\e[0m"
          echo
        fi

        echo
        echo "Creating missing opt dirs if missing:"
        echo

        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}

        echo
        echo "Airflow version:"
        /entrypoint airflow version

        echo
        echo "Running airflow config list to create default config file if missing."

        /entrypoint airflow config list >/dev/null

        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"

        chown -R "${AIRFLOW_UID}:0" /opt/airflow/

        echo
        echo "Files in shared volumes:"

        ls -la /opt/airflow/{logs,dags,plugins,config}

    environment:
      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: 'true'

      _AIRFLOW_WWW_USER_CREATE: 'true'

      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}

      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

      _PIP_ADDITIONAL_REQUIREMENTS: ''

    user: "0:0"


  # ===========================================================
  # AIRFLOW CLI
  # ===========================================================

  airflow-cli:
    <<: *airflow-common

    profiles:
      - debug

    environment:
      <<: *airflow-common-env

      CONNECTION_CHECK_MAX_COUNT: "0"

    command:
      - bash
      - -c
      - airflow

    depends_on:
      <<: *airflow-common-depends-on


  # ===========================================================
  # FLOWER
  # ===========================================================

  flower:
    <<: *airflow-common

    command: celery flower

    profiles:
      - flower

    ports:
      - "5555:5555"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:5555/"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ===========================================================
  # APPLICATION POSTGRESQL
  # ===========================================================

  postgresql-data:
    image: postgres:16

    container_name: data-db

    environment:
      POSTGRES_DB: amn_datawarehouse
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword

    volumes:
      - postgres_data_app:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5432:5432"

    networks:
      - airflow-network


  # ===========================================================
  # PGADMIN
  # ===========================================================

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: my_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword

    ports:
      - "8081:80"

    depends_on:
      - postgres

    networks:
      - airflow-network

    volumes:
      - pgadmin_data:/var/lib/pgadmin


  # ===========================================================
  # MINIO DATA LAKE
  # ===========================================================

  data-lake:
    image: minio/minio

    container_name: data-lake

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - data-lake:/data

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

    restart: always

    networks:
      - airflow-network


# =============================================================
# VOLUMES
# =============================================================

volumes:

  postgres_data_app:

  data-lake:

  postgres-db-volume:

  pgadmin_data:

  prometheus_data:

  grafana_data:


# =============================================================
# NETWORK
# =============================================================

networks:

  airflow-network:
    driver: bridge